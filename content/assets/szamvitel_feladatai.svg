<!-- 1. KÉP: szamvitel_feladatai.svg -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 360" width="100%" height="100%">
  <rect width="850" height="360" fill="#f8f9fa" rx="10"/>
  <text x="425" y="35" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#2c3e50">A Számvitel Tevékenységei és Feladatai</text>
  
  <!-- Tartalmi 1 -->
  <rect x="30" y="100" width="140" height="130" rx="15" fill="#e84393"/>
  <text x="100" y="145" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">Tervezés</text>
  <text x="100" y="175" font-family="Arial, sans-serif" font-size="12" fill="#ffffff" text-anchor="middle">Mit figyelünk meg?</text>

  <!-- Technikai 1 -->
  <rect x="190" y="100" width="140" height="130" rx="15" fill="#a29bfe"/>
  <text x="260" y="145" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">Gyűjtés</text>
  <text x="260" y="175" font-family="Arial, sans-serif" font-size="12" fill="#ffffff" text-anchor="middle">Bizonylatok</text>
  <text x="260" y="195" font-family="Arial, sans-serif" font-size="12" fill="#ffffff" text-anchor="middle">összegyűjtése</text>

  <!-- Technikai 2 -->
  <rect x="350" y="100" width="140" height="130" rx="15" fill="#0984e3"/>
  <text x="420" y="145" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">Feldolgozás</text>
  <text x="420" y="175" font-family="Arial, sans-serif" font-size="12" fill="#ffffff" text-anchor="middle">Rögzítés,</text>
  <text x="420" y="195" font-family="Arial, sans-serif" font-size="12" fill="#ffffff" text-anchor="middle">könyvelés</text>

  <!-- Tartalmi 2 -->
  <rect x="510" y="100" width="140" height="130" rx="15" fill="#74b9ff"/>
  <text x="580" y="140" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">Szolgáltatás</text>
  <text x="580" y="170" font-family="Arial, sans-serif" font-size="12" fill="#ffffff" text-anchor="middle">Pénzügyi</text>
  <text x="580" y="190" font-family="Arial, sans-serif" font-size="12" fill="#ffffff" text-anchor="middle">kimutatások</text>

  <!-- Tartalmi 3 -->
  <rect x="670" y="100" width="140" height="130" rx="15" fill="#00b894"/>
  <text x="740" y="140" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">Magyarázat</text>
  <text x="740" y="170" font-family="Arial, sans-serif" font-size="12" fill="#ffffff" text-anchor="middle">Értelmezés a</text>
  <text x="740" y="190" font-family="Arial, sans-serif" font-size="12" fill="#ffffff" text-anchor="middle">döntéshozóknak</text>

  <!-- Címkék alul/felül -->
  <rect x="30" y="60" width="780" height="30" fill="#0984e3" opacity="0.1" rx="5"/>
  <text x="100" y="80" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#d63031">TARTALMI FELADATOK</text>
  <text x="420" y="260" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#d63031" text-anchor="middle">TECHNIKAI FELADATOK (Gyűjtés + Feldolgozás)</text>
  <text x="660" y="80" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#d63031">TARTALMI FELADATOK</text>
</svg>
