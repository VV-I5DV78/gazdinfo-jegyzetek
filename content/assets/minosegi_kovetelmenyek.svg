<!-- 2. KÉP: minosegi_kovetelmenyek.svg -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 380" width="100%" height="100%">
  <rect width="750" height="380" fill="#f8f9fa" rx="10"/>
  <text x="375" y="35" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#2c3e50">Pénzügyi Kimutatások Minőségi Követelményei</text>

  <!-- Főcsoport: Minőségi jellemzők -->
  <rect x="30" y="160" width="130" height="60" rx="10" fill="#fdcb6e"/>
  <text x="95" y="195" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#d35400" text-anchor="middle">Minőségi jellemzők</text>

  <!-- Alapvető jellemzők -->
  <rect x="210" y="80" width="140" height="50" rx="8" fill="#74b9ff"/>
  <text x="280" y="110" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">Alapvető jellemzők</text>

  <rect x="390" y="60" width="150" height="40" rx="6" fill="#ff7675"/>
  <text x="465" y="85" font-family="Arial, sans-serif" font-size="13" fill="#ffffff" text-anchor="middle">Relevancia</text>

  <rect x="390" y="110" width="150" height="40" rx="6" fill="#ff7675"/>
  <text x="465" y="135" font-family="Arial, sans-serif" font-size="13" fill="#ffffff" text-anchor="middle">Hű bemutatás</text>

  <!-- Hasznosságot fokozó követelmények -->
  <rect x="210" y="240" width="140" height="60" rx="8" fill="#74b9ff"/>
  <text x="280" y="267" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">Hasznosságot fokozó</text>
  <text x="280" y="285" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">követelmények</text>

  <rect x="390" y="180" width="150" height="35" rx="6" fill="#ff7675"/>
  <text x="465" y="202" font-family="Arial, sans-serif" font-size="12" fill="#ffffff" text-anchor="middle">Összehasonlíthatóság</text>

  <rect x="390" y="225" width="150" height="35" rx="6" fill="#ff7675"/>
  <text x="465" y="247" font-family="Arial, sans-serif" font-size="12" fill="#ffffff" text-anchor="middle">Igazolhatóság</text>

  <rect x="390" y="270" width="150" height="35" rx="6" fill="#ff7675"/>
  <text x="465" y="292" font-family="Arial, sans-serif" font-size="12" fill="#ffffff" text-anchor="middle">Időszerűség</text>

  <rect x="390" y="315" width="150" height="35" rx="6" fill="#ff7675"/>
  <text x="465" y="337" font-family="Arial, sans-serif" font-size="12" fill="#ffffff" text-anchor="middle">Érthetőség</text>

  <!-- Nyilak / Vonalak -->
  <line x1="160" y1="190" x2="210" y2="105" stroke="#636e72" stroke-width="2"/>
  <line x1="160" y1="190" x2="210" y2="270" stroke="#636e72" stroke-width="2"/>
  <line x1="350" y1="105" x2="390" y2="80" stroke="#636e72" stroke-width="2"/>
  <line x1="350" y1="105" x2="390" y2="130" stroke="#636e72" stroke-width="2"/>
  <line x1="350" y1="270" x2="390" y2="197" stroke="#636e72" stroke-width="2"/>
  <line x1="350" y1="270" x2="390" y2="242" stroke="#636e72" stroke-width="2"/>
  <line x1="350" y1="270" x2="390" y2="287" stroke="#636e72" stroke-width="2"/>
  <line x1="350" y1="270" x2="390" y2="332" stroke="#636e72" stroke-width="2"/>

  <!-- Együttes követelmény zárójel -->
  <path d="M 550,60 Q 565,105 580,105 Q 565,105 550,150" fill="none" stroke="#2d3436" stroke-width="2"/>
  <text x="600" y="100" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#2d3436">Együttes</text>
  <text x="600" y="118" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#2d3436">követelmény</text>
</svg>
